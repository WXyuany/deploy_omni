schema_version: 1

bridge:
  robot_name: kepler_k2
  loop_rate_hz: 250
  stale_command_timeout_ms: 120
  startup_idle_policy:
    mode: zero_torque
    require_first_valid_command: true
    use_adapter_safe_command: true
  fault_policy:
    mode: fail_stop
    send_safe_command_on_fault: true
    publish_degraded_state_while_faulted: true
    halt_command_writes_while_faulted: true

dds:
  domain_id: 0
  topics:
    command:
      name: kepler_k2/low_level_command
    state:
      name: kepler_k2/low_level_state
    status:
      name: kepler_k2/bridge_status

adapter:
  kind: kepler_k2
  robot_model: k2
  command_mode: torque_pd_passthrough
  connection:
    transport: udp
    interface_hint: robot_lan0
  startup:
    read_initial_state_timeout_ms: 1000
    require_healthy_hardware: true
  safety:
    safe_command_profile: zero_torque
    allow_safe_command_during_shutdown: true

joint_mapping:
  validation:
    expected_sim_joint_count: 12
    expected_hardware_joint_count: 12
    require_dense_enabled_sim_indexes: true
    require_dense_enabled_hardware_indexes: true
    require_unique_enabled_sim_names: true
    require_unique_enabled_hardware_names: true
  entries:
    - sim_index: 0
      hardware_index: 0
      sim_name: left_hip_yaw
      hardware_name: l_hip_yaw
      label: left hip yaw
      enabled: true
      transforms:
        position: {sign: 1.0, offset: 0.0}
        velocity: {sign: 1.0, offset: 0.0}
        effort: {sign: 1.0, offset: 0.0}
        stiffness: {sign: 1.0, offset: 0.0}
        damping: {sign: 1.0, offset: 0.0}
        acceleration: {sign: 1.0, offset: 0.0}
      sim_limits:
        position: {lower: -0.8, upper: 0.8}
        velocity: {lower: -6.0, upper: 6.0}
        effort: {lower: -120.0, upper: 120.0}
        stiffness: {lower: 0.0, upper: 200.0}
        damping: {lower: 0.0, upper: 20.0}
      hardware_limits:
        position: {lower: -0.8, upper: 0.8}
        velocity: {lower: -6.0, upper: 6.0}
        effort: {lower: -120.0, upper: 120.0}

    - sim_index: 1
      hardware_index: 1
      sim_name: left_hip_roll
      hardware_name: l_hip_roll
      label: left hip roll
      enabled: true
      transforms:
        position: {sign: 1.0, offset: 0.0}
        velocity: {sign: 1.0, offset: 0.0}
        effort: {sign: 1.0, offset: 0.0}
        stiffness: {sign: 1.0, offset: 0.0}
        damping: {sign: 1.0, offset: 0.0}
        acceleration: {sign: 1.0, offset: 0.0}
      sim_limits:
        position: {lower: -0.5, upper: 0.5}
        velocity: {lower: -6.0, upper: 6.0}
        effort: {lower: -120.0, upper: 120.0}
      hardware_limits:
        position: {lower: -0.5, upper: 0.5}
        velocity: {lower: -6.0, upper: 6.0}
        effort: {lower: -120.0, upper: 120.0}

    - sim_index: 2
      hardware_index: 2
