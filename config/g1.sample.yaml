schema_version: 1

bridge:
  robot_name: unitree_g1
  loop_rate_hz: 500
  stale_command_timeout_ms: 120
  startup_idle_policy:
    mode: zero_torque
    require_first_valid_command: true
    use_adapter_safe_command: true
  fault_policy:
    mode: fail_stop
    send_safe_command_on_fault: true
    publish_degraded_state_while_faulted: true
    halt_command_writes_while_faulted: true

dds:
  domain_id: 0
  topics:
    command:
      name: bridge/command
    state:
      name: bridge/state

debug_print:
  state: false
  cmd: false
  rate_hz: 2

adapter:
  kind: unitree_g1
  backend: raw_low_level
  robot_model: g1
  command_mode: raw_low_level
  connection:
    transport: dds
    interface_hint: wlp0s20f3
  startup:
    read_initial_state_timeout_ms: 1000
    require_healthy_hardware: true
  safety:
    safe_command_profile: zero_torque
    allow_safe_command_during_shutdown: true

joint_mapping:
  validation:
    expected_sim_joint_count: 29
    expected_hardware_joint_count: 29
    require_dense_enabled_sim_indexes: true
    require_dense_enabled_hardware_indexes: true
    require_unique_enabled_sim_names: true
    require_unique_enabled_hardware_names: true
