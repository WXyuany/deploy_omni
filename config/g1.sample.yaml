# Low-level simulation topic example. For high-level control use unitree_g1_motion_demo.
schema_version: 1

bridge:
  robot_name: unitree_g1
  loop_rate_hz: 1000
  lowstate_trigger: event
  stale_command_timeout_ms: 120
  fault_policy:
    mode: fail_stop
    publish_degraded_state_while_faulted: true
    halt_command_writes_while_faulted: true

dds:
  domain_id: 0
  topics:
    command:
      name: bridge/rt/lowcmd
    state:
      name: bridge/rt/lowstate

debug_print:
  state: false
  cmd: false
  forwarding_log: false
  rate_hz: 2

assembly:
  profile: unitree_g1
  adapter:
    type: unitree_g1
  command_ingress:
    enabled: true
    type: dds
  state_egress:
    enabled: true
    type: dds

  modules:
    - name: gamepad
      enabled: false
      type: sdl
      controller_index: 0
      mapping_path: config/gamecontrollerdb.txt
      poll_interval_ms: 5
      stale_timeout_ms: 100
adapter:
  kind: unitree_g1
  robot_model: g1
  command_mode: raw_low_level
  connection:
    transport: dds
    interface_hint: eth0
  topics:
    command: custom/mujoco/rt/lowcmd
    state: custom/mujoco/rt/lowstate
    sim_command: custom/mujoco/rt/lowcmd
    sim_state: custom/mujoco/rt/lowstate
    imu: rt/secondary_imu
  startup:
    read_initial_state_timeout_ms: 1000
    require_healthy_hardware: true

joint_mapping:
  validation:
    expected_sim_joint_count: 29
    expected_hardware_joint_count: 29
    require_dense_enabled_sim_indexes: true
    require_dense_enabled_hardware_indexes: true
    require_unique_enabled_sim_names: true
    require_unique_enabled_hardware_names: true
  entries:
    - sim_index: 0
      hardware_index: 0
      sim_name: sim_left_hip_pitch
      hardware_name: left_hip_pitch
      label: left_hip_pitch
      enabled: true
      transforms:
        position: {sign: 1.0, offset: 0.0}
        velocity: {sign: 1.0, offset: 0.0}
        effort: {sign: 1.0, offset: 0.0}
        stiffness: {sign: 1.0, offset: 0.0}
        damping: {sign: 1.0, offset: 0.0}
        acceleration: {sign: 1.0, offset: 0.0}
      sim_limits:
        position: {lower: -3.14, upper: 3.14}
      hardware_limits:
        position: {lower: -3.14, upper: 3.14}
    - sim_index: 1
      hardware_index: 1
      sim_name: sim_left_hip_roll
