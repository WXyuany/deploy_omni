schema_version: 1

bridge:
  robot_name: pm01
  loop_rate_hz: 250
  lowstate_trigger: event
  stale_command_timeout_ms: 120
  fault_policy:
    mode: fail_stop
    publish_degraded_state_while_faulted: true
    halt_command_writes_while_faulted: true

dds:
  domain_id: 0
  topics:
    command:
      name: bridge/rt/lowcmd
    state:
      name: bridge/rt/lowstate
    imu_state:
      name: bridge/rt/secondary_imu
    bms_state:
      name: bridge/rt/lf/bmsstate
    mainboard_state:
      name: bridge/rt/lf/mainboardstate

debug_print:
  state: false
  cmd: true
  rate_hz: 2

assembly:
  profile: pm01
  adapter:
    type: pm01
  command_ingress:
    enabled: true
    type: dds
  state_egress:
    enabled: true
    type: dds

  modules:
    - name: gamepad
      enabled: false
      type: sdl
      controller_index: 0
      mapping_path: config/gamecontrollerdb.txt
      poll_interval_ms: 5
      stale_timeout_ms: 100
adapter:
  kind: pm01
  robot_model: pm01
  command_mode: joint_bridge
  motion_state:
    required: false
    required_task: joint_bridge
  connection:
    transport: ros2
  startup:
    read_initial_state_timeout_ms: 1000
    require_healthy_hardware: true

joint_mapping:
  validation:
    expected_sim_joint_count: 24
    expected_hardware_joint_count: 24
    require_dense_enabled_sim_indexes: true
    require_dense_enabled_hardware_indexes: true
    require_unique_enabled_sim_names: true
    require_unique_enabled_hardware_names: true
  entries:
    - sim_index: 0
      hardware_index: 0
      sim_name: sim_l_hip_yaw
      hardware_name: l_hip_yaw
      label: l_hip_yaw
      enabled: true
      transforms:
        position: {sign: 1.0, offset: 0.0}
        velocity: {sign: 1.0, offset: 0.0}
        effort: {sign: 1.0, offset: 0.0}
        stiffness: {sign: 1.0, offset: 0.0}
        damping: {sign: 1.0, offset: 0.0}
        acceleration: {sign: 1.0, offset: 0.0}
      sim_limits:
        position: {lower: -1.0, upper: 1.0}
      hardware_limits:
        position: {lower: -1.0, upper: 1.0}
